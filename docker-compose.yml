version: '3.8'

services:
  # MySQL 데이터베이스 컨테이너
  mysql:
    build: ./mysql
    container_name: study-survival-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: study_survival_db
    ports:
      - "3308:3306"          # PC의 3308번 포트와 컨테이너의 3306번 포트 연결
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d
    networks:
      - app-network

  # 웹 서버(Nginx) 컨테이너
  web:
    build: ./web
    container_name: study-survival-web
    restart: always
    ports:
      - "80:80"              # 브라우저에서 접속할 포트
    volumes:
      - ./web/src:/usr/share/nginx/html
    networks:
      - app-network
    depends_on:
      - mysql                # MySQL이 먼저 실행된 후 웹 서버 실행

# 두 컨테이너가 서로 통신할 수 있는 가상 네트워크
networks:
  app-network:
    driver: bridge
